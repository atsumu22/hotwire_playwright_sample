# .github/workflows/test.yml
name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      DATABASE_URL: sqlite3:db/test.sqlite3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Database
        run: |
          mkdir -p db
          bundle exec rails db:create
          bundle exec rails db:migrate

      - name: Run RSpec tests
        run: bundle exec rspec
        continue-on-error: true

      - name: Run RSpec tests and identify failures
        run: |
          # 失敗したテストを記録
          bundle exec rspec --format json --out rspec_results.json
          
          # 失敗したテストの名前を抽出
          ruby -rjson -e "
            data = JSON.parse(File.read('rspec_results.json'))
            failures = data['examples'].select { |ex| ex['status'] == 'failed' }
            File.write('failed_tests.txt', failures.map { |f| f['full_description'] }.join(\"\n\"))
          "
        continue-on-error: true

      - name: Flaky Test Analysis for Failed Tests
        run: |
          echo ""
          echo "🧪 フレキーテスト チェック開始"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ ! -f failed_tests.txt ]; then
            echo "🎉 失敗したテストがありません！"
            exit 0
          fi
          
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            
            echo "📊 対象: $test_name"
            echo ""
            
            success=0
            runs=10
            start_time=$(date +%s)
            
            printf "実行状況: "
            for i in $(seq 1 $runs); do
              if timeout 90 bundle exec rspec spec/system/tasks_spec.rb -e "$test_name" >/dev/null 2>&1; then
                success=$((success + 1))
                printf "✅"
              else
                printf "❌"
              fi
              printf " "
            done
            
            end_time=$(date +%s)
            total_time=$((end_time - start_time))
            success_rate=$((success * 100 / runs))
            failure_rate=$((100 - success_rate))
            
            echo ""
            echo ""
            echo "📈 結果サマリー:"
            echo "   ✅ 成功: $success回/$runs回"
            echo "   ❌ 失敗: $((runs - success))回/$runs回"
            echo "   📊 成功率: $success_rate%"
            echo "   📊 失敗率: $failure_rate%"
            echo "   ⏱️  実行時間: ${total_time}s"
            echo ""
            
            if [ $success_rate -ge 90 ]; then
              echo "🎉 判定: 安定 (偶発的失敗)"
            elif [ $success_rate -ge 70 ]; then
              echo "⚠️  判定: 軽微なフレキー"
            else
              echo "🚨 判定: 高フレキー (要対処)"
            fi
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
          done < failed_tests.txt
        continue-on-error: true
        