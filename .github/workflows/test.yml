# .github/workflows/test.yml
name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      DATABASE_URL: sqlite3:db/test.sqlite3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Database
        run: |
          mkdir -p db
          bundle exec rails db:create
          bundle exec rails db:migrate

      - name: Run Individual Test Analysis
        run: |
          echo "=== 個別テスト分析開始 ==="
          
          success=0
          total=0
          
          tests=(
            "プロジェクト詳細画面が表示されること"
            "タスク追加ボタンをクリックすると、モーダルが現れること"
            "チェックボックスクリックでタスクが完了状態にできること"
            "すべて完了にするボタンで一定時間待機後全タスクが完了状態になること"
          )
          
          for test in "${tests[@]}"; do
            total=$((total + 1))
            echo "--- テスト: $test ---"
            if timeout 60 bundle exec rspec spec/system/tasks_spec.rb -e "$test"; then
              echo "✅ 成功"
              success=$((success + 1))
            else
              echo "❌ 失敗"
            fi
          done
          
          echo "=== 結果サマリー ==="
          echo "成功: $success/$total"
          echo "失敗率: $(( (total - success) * 100 / total ))%"
        continue-on-error: true

      - name: Collect Failure Screenshots
        if: always()
        run: |
          echo "スクリーンショット一覧:"
          find tmp/capybara -name "*.png" | head -10 || echo "スクリーンショットなし"
        continue-on-error: true

      - name: Run Flaky Test Detection (Capybara)
        run: |
          echo "=== フレキーテスト検出開始 ==="
          success=0
          total=10
          
          for i in $(seq 1 $total); do
            echo "=== Capybara実行 $i 回目 ==="
            if timeout 90 bundle exec rspec spec/system/tasks_spec.rb -e "すべて完了にするボタンで一定時間待機後全タスクが完了状態になること"; then
              success=$((success + 1))
              echo "✅ $i 回目: 成功"
            else
              echo "❌ $i 回目: 失敗"
            fi
          done
          
          failure=$((total - success))
          failure_rate=$(( failure * 100 / total ))
          echo "=== フレキーテスト結果 ==="
          echo "成功: $success/$total"
          echo "失敗: $failure/$total"
          echo "失敗率: $failure_rate%"
          
          # CSVファイルに記録
          echo "テスト名,実行回数,成功,失敗,失敗率" > flaky_test_results.csv
          echo "すべて完了にする,$total,$success,$failure,$failure_rate%" >> flaky_test_results.csv
        continue-on-error: true

      - name: Upload Flaky Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: flaky-test-results
          path: flaky_test_results.csv

      - name: Run RSpec tests
        run: bundle exec rspec
        continue-on-error: true
