# .github/workflows/test.yml
name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      DATABASE_URL: sqlite3:db/test.sqlite3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Database
        run: |
          mkdir -p db
          bundle exec rails db:create
          bundle exec rails db:migrate

      - name: Run RSpec tests
        run: bundle exec rspec

      - name: Run Flaky Test Detection (Capybara)
        run: |
          success=0
          total=10
          for i in $(seq 1 $total); do
            echo "=== Capybara実行 $i 回目 ==="
            if bundle exec rspec spec/system/tasks_spec.rb; then
              success=$((success + 1))
            fi
          done
          echo "成功率: $success/$total"